apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: cinescale
spec:
  replicas: 2
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: cinescale-api:latest
          imagePullPolicy: IfNotPresent
          command:
            - celery
            - -A
            - services.worker.celery_app
            - worker
            - --loglevel=info
            - --concurrency=4
          envFrom:
            - configMapRef:
                name: cinescale-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: cinescale-secrets
                  key: database-url
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: cinescale-secrets
                  key: minio-access-key
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: cinescale-secrets
                  key: minio-secret-key
          livenessProbe:
            exec:
              command:
                - celery
                - -A
                - services.worker.celery_app
                - inspect
                - ping
            initialDelaySeconds: 30
            periodSeconds: 60
            timeoutSeconds: 10
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 2Gi
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: worker-hpa
  namespace: cinescale
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: worker
  minReplicas: 2
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 85
